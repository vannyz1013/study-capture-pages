<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Capture</title>
  <meta name="theme-color" content="#fff8e7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Capture" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="/study-capture-pages/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/study-capture-pages/icons/icon-180.png" />
  <link rel="icon" type="image/png" href="/study-capture-pages/icons/icon-192.png" />
  <script type="module" crossorigin src="/study-capture-pages/assets/index-BzI0wQWG.js"></script>
  <link rel="stylesheet" crossorigin href="/study-capture-pages/assets/index-C6p97yaI.css">
</head>
<body>
  <!-- The form is plain HTML so the text box is on screen (and focused) before any script has loaded. -->
  <main class="app">
    <header class="status" id="status" role="status" aria-live="polite">Loading…</header>
    <p class="warn" id="warn" hidden></p>

    <div class="chips" id="chips" role="radiogroup" aria-label="Type"></div>

    <textarea id="text" class="text" autofocus rows="5" maxlength="20000"
              placeholder="Type… (Question: / todo: / 重点： pick the type, #tags)"
              aria-label="Capture text" autocapitalize="sentences" enterkeyhint="enter"></textarea>

    <div class="row">
      <input id="tags" class="tags" type="text" placeholder="#tags" aria-label="Tags"
             autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done" />
      <button id="star" class="star" type="button" aria-pressed="false" aria-label="Important">☆</button>
    </div>

    <div class="row">
      <select id="course" class="course" aria-label="Course"></select>
      <button id="save" class="save" type="button" disabled>Save</button>
    </div>

    <section class="recent" aria-label="Saved on this phone">
      <h2>Saved on this phone</h2>
      <ol id="recent"></ol>
      <button id="recently-deleted" class="text-link" type="button" hidden>Recently Deleted</button>
    </section>
  </main>
  <dialog id="note-sheet" class="note-sheet" aria-labelledby="sheet-title">
    <div class="sheet-handle" aria-hidden="true"></div>
    <header class="sheet-header">
      <h2 id="sheet-title">Note Details</h2>
      <button id="sheet-close" class="sheet-close" type="button" aria-label="Close">×</button>
    </header>
    <div id="sheet-body" class="sheet-body"></div>
    <footer id="sheet-actions" class="sheet-actions"></footer>
  </dialog>
</body>
</html>
